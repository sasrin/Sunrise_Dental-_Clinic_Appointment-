<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic - Register Appointment</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1>Register New Appointment</h1>
            <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
        
        <form id="appointmentForm" class="form-container">
            <div class="form-group">
                <label for="appointmentNumber">Appointment Number *</label>
                <input type="text" id="appointmentNumber" name="appointmentNumber" required>
                <small class="form-hint">Enter unique appointment number (e.g., APT001)</small>
            </div>
            
            <div class="form-group">
                <label for="patientName">Patient Name *</label>
                <input type="text" id="patientName" name="patientName" required>
            </div>
            
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="contactNumber">Contact Number *</label>
                <input type="tel" id="contactNumber" name="contactNumber" required pattern="[0-9]{10}">
                <small class="form-hint">Enter 10-digit phone number</small>
            </div>
            
            <div class="form-group">
                <label for="dentistName">Dentist Name *</label>
                <input type="text" id="dentistName" name="dentistName" required>
            </div>
            
            <div class="form-group">
                <label for="treatmentType">Treatment Type *</label>
                <select id="treatmentType" name="treatmentType" required>
                    <option value="">Select Treatment</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Filling">Filling</option>
                    <option value="Root Canal">Root Canal</option>
                    <option value="Extraction">Extraction</option>
                    <option value="Crown">Crown</option>
                    <option value="Denture">Denture</option>
                    <option value="Braces">Braces</option>
                    <option value="Whitening">Whitening</option>
                    <option value="Checkup">Checkup</option>
                    <option value="X-Ray">X-Ray</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="appointmentDate">Appointment Date *</label>
                <input type="date" id="appointmentDate" name="appointmentDate" required>
            </div>
            
            <div class="form-group">
                <label for="appointmentTime">Appointment Time *</label>
                <input type="time" id="appointmentTime" name="appointmentTime" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Register Appointment</button>
        </form>
        
        <div id="message" class="message"></div>
    </div>
    
    <script>
        document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            
            // Frontend validation
            const appointmentNumber = document.getElementById('appointmentNumber').value.trim();
            const patientName = document.getElementById('patientName').value.trim();
            const address = document.getElementById('address').value.trim();
            const contactNumber = document.getElementById('contactNumber').value.trim();
            const dentistName = document.getElementById('dentistName').value.trim();
            const treatmentType = document.getElementById('treatmentType').value;
            const appointmentDate = document.getElementById('appointmentDate').value;
            const appointmentTime = document.getElementById('appointmentTime').value;
            
            if (!appointmentNumber || !patientName || !address || !contactNumber || 
                !dentistName || !treatmentType || !appointmentDate || !appointmentTime) {
                messageDiv.textContent = 'All fields are required';
                messageDiv.className = 'message error';
                return;
            }
            
            if (!contactNumber.match(/^[0-9]{10}$/)) {
                messageDiv.textContent = 'Contact number must be 10 digits';
                messageDiv.className = 'message error';
                return;
            }
            
            if (patientName.length < 2 || patientName.length > 100) {
                messageDiv.textContent = 'Patient name must be between 2 and 100 characters';
                messageDiv.className = 'message error';
                return;
            }
            
            messageDiv.textContent = 'Registering appointment...';
            messageDiv.className = 'message info';
            
            try {
                const response = await fetch('api/appointments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `appointmentNumber=${encodeURIComponent(appointmentNumber)}&` +
                          `patientName=${encodeURIComponent(patientName)}&` +
                          `address=${encodeURIComponent(address)}&` +
                          `contactNumber=${encodeURIComponent(contactNumber)}&` +
                          `dentistName=${encodeURIComponent(dentistName)}&` +
                          `treatmentType=${encodeURIComponent(treatmentType)}&` +
                          `appointmentDate=${encodeURIComponent(appointmentDate)}&` +
                          `appointmentTime=${encodeURIComponent(appointmentTime)}`
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    document.getElementById('appointmentForm').reset();
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                messageDiv.textContent = 'Error connecting to server';
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
